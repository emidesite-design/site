<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO: Title e Meta Description -->
    <title>EMIDE | Sets, Beats & Produção Musical</title>
    <meta name="description" content="Ouça EMIDE - DJ e produtor eletrônico. Descubra sets ao vivo, beats originais no Spotify, SoundCloud e Beatport. Visuais dark e groove hipnótico." />
    
    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="EMIDE | DJ Eletrônico - Sets & Beats" />
    <meta property="og:description" content="DJ e produtor eletrônico com sets exclusivos, beats originais e presença em plataformas de streaming global." />
    <meta property="og:image" content="/assets/emide-footer-2.jpg" />
    <meta property="og:url" content="https://emidesite-design.github.io/site/" />
    <meta property="og:site_name" content="EMIDE" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EMIDE | DJ Eletrônico" />
    <meta name="twitter:description" content="DJ e produtor eletrônico com sets exclusivos e produção musical original." />
    <meta name="twitter:image" content="/assets/emide-footer-2.jpg" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://emidesite-design.github.io/site/" />
    
    <!-- Preconnect para performance -->
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://soundcloud.com" />
    <link rel="preconnect" href="https://www.spotify.com" />
    <link rel="dns-prefetch" href="https://drive.google.com" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/logo-icone.ico">
    <link rel="apple-touch-icon" href="/assets/logo-icone.ico" />
    
    <!-- JSON-LD Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MusicGroup",
      "name": "EMIDE",
      "description": "DJ e produtor eletrônico com sets ao vivo e produção musical original",
      "url": "https://emidesite-design.github.io/site/",
      "image": "/assets/emide-footer-2.jpg",
      "sameAs": [
        "https://www.spotify.com/search/EMIDE",
        "https://soundcloud.com/search?q=EMIDE",
        "https://www.beatport.com/search?q=EMIDE",
        "https://www.youtube.com/results?search_query=EMIDE+DJ"
      ],
      "genre": ["Techno", "Tech House", "Minimal", "Deep House"]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
